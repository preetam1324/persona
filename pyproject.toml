[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "persona"
version = "0.1.0"
description = "Define AI agents in YAML, deploy anywhere as Docker containers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Persona Contributors" }]
keywords = ["ai", "agents", "llm", "docker", "byoc", "deployment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "jinja2>=3.1",
    "httpx>=0.24",
    "sse-starlette>=1.6",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
docker = ["docker>=7.0"]
rag = ["chromadb>=0.4", "tiktoken>=0.5"]
ollama = ["ollama>=0.1"]
avatar = ["openai>=1.0", "websockets>=12.0", "aiofiles>=23.0"]
all = ["openai>=1.0", "anthropic>=0.20", "docker>=7.0", "websockets>=12.0", "aiofiles>=23.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1"]

[project.scripts]
persona = "persona.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["persona"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
